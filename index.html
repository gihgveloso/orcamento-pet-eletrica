<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orçamento PET Elétrica</title>
  <meta name="description" content="Controle de orçamento pessoal do minicurso de Planejamento Financeiro do PET Elétrica (UFU). Funciona offline, sem cadastro.">
  <meta name="theme-color" content="#363636">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#view">Pular para o conteúdo</a>

  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <span class="brand-text"><span>Orçamento</span><strong>PET Elétrica</strong></span>
    </div>
    <div class="top-actions">
      <button type="button" class="btn-ghost" data-action="nav" data-view="ajuda">Como usar</button>
      <button type="button" class="btn-ghost" id="btn-apresentacao" data-action="toggle-presentation" aria-pressed="false">Modo apresentação</button>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="layout">
    <nav id="app-nav" class="app-nav" aria-label="Seções do app">
      <button type="button" data-action="nav" data-view="painel">Painel</button>
      <button type="button" data-action="nav" data-view="lancar">Lançar</button>
      <button type="button" data-action="nav" data-view="lista">Lançamentos</button>
      <button type="button" data-action="nav" data-view="graficos">Gráficos</button>
      <button type="button" data-action="nav" data-view="orcamento">Orçamento</button>
    </nav>

    <div class="content">
      <div id="month-bar" class="month-bar" hidden>
        <button type="button" class="month-arrow" data-action="month" data-delta="-1" aria-label="Mês anterior">‹</button>
        <h1 id="month-label" aria-live="polite"></h1>
        <button type="button" class="month-arrow" data-action="month" data-delta="1" aria-label="Próximo mês">›</button>
        <button type="button" class="btn-ghost month-today" data-action="month-today" hidden>Ir para hoje</button>
      </div>
      <main id="view" tabindex="-1"></main>
      <footer class="privacy">
        <p>Seus dados ficam só neste aparelho. Nada é enviado para a internet. Exporte um backup em Orçamento &gt; Seus dados.</p>
        <p>Feito pelo PET Elétrica UFU para o minicurso de Planejamento Financeiro.</p>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="banner">Este app precisa de JavaScript ativado para funcionar.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
